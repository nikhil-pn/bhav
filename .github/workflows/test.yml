name: test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: starts without secrets
        run: |
          node src/server.mjs & pid=$!
          for i in $(seq 1 20); do curl -sf localhost:3420/health && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' 'localhost:3420/v1/quote?q=eggs')" = 403
          kill $pid
